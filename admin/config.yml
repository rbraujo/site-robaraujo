backend:
  name: git-gateway
  branch: main

media_folder: "assets/images"
public_folder: "/assets/images"

collections:
  - name: "projects"
    label: "Projects"
    files:
      - label: "Main"
        name: "main"
        file: "_data/projects.json"

        fields:
          - label: "Title"
            name: "title"
            widget: "string"

          - label: "Description"
            name: "description"
            widget: "text"

          - label: "Thumbnail"
            name: "thumbnail"
            widget: "image"
