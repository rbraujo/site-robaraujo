backend:
  name: git-gateway
  branch: main

media_folder: "assets/images"
public_folder: "/assets/images"

collections:

  - name: "projects"
    label: "Projetos"

    files:
      - file: "_data/projects.json"
        label: "Lista de Projetos"
        name: "projects"

        fields:
          - label: "Projetos"
            name: "projects"
            widget: "list"

            fields:
              - { label: "ID", name: "id", widget: "string" }

              - { label: "Título", name: "title", widget: "string" }

              - label: "Categoria"
                name: "category"
                widget: "select"

                options:
                  - { label: "3D Print", value: "print" }
                  - { label: "Digital", value: "digital" }

              - { label: "Tag", name: "tag", widget: "string" }

              - { label: "Ano", name: "year", widget: "string" }

              - { label: "Imagem", name: "image", widget: "image" }

              - { label: "Ativo", name: "enabled", widget: "boolean", default: true }

  - name: "site_config"
    label: "Configurações do Site"

    files:
      - file: "_data/site.json"
        label: "Configurações Gerais"
        name: "site"

        fields:
          - { label: "Título do Site", name: "title", widget: "string" }

          - { label: "Descrição", name: "description", widget: "text" }

          - { label: "URL", name: "url", widget: "string" }

          - { label: "Email", name: "email", widget: "string" }

          - label: "Redes Sociais"
            name: "socials"
            widget: "object"

            fields:
              - { label: "ArtStation", name: "artstation", widget: "string" }

              - { label: "Instagram", name: "instagram", widget: "string" }

              - { label: "LinkedIn", name: "linkedin", widget: "string" }

              - { label: "YouTube", name: "youtube", widget: "string" }

              - { label: "Patreon", name: "patreon", widget: "string" }

              - { label: "X/Twitter", name: "x", widget: "string" }

              - { label: "Bluesky", name: "bluesky", widget: "string" }

          - label: "Seções"
            name: "sections"
            widget: "object"

            fields:
              - label: "Galeria"
                name: "gallery"
                widget: "object"

                fields:
                  - { label: "Ativa", name: "enabled", widget: "boolean" }

              - label: "Sobre"
                name: "about"
                widget: "object"

                fields:
                  - { label: "Ativa", name: "enabled", widget: "boolean" }

              - label: "Contato"
                name: "contact"
                widget: "object"

                fields:
                  - { label: "Ativa", name: "enabled", widget: "boolean" }

          - label: "Menu"
            name: "nav"
            widget: "list"

            fields:
              - { label: "Label", name: "label", widget: "string" }

              - { label: "Filtro", name: "filter", widget: "string" }

              - { label: "Ativo", name: "enabled", widget: "boolean", default: true }
